<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Catatan Keuangan Rumah Tangga</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="wrap">
    <section class="ringkasan">
      <article class="kartu kartu-ringkas">
        <h2>Total Pemasukan</h2> <p class="angka masuk" id="total-pemasukan">Rp 0</p>
      </article>
      <article class="kartu kartu-ringkas">
        <h2>Total Pengeluaran</h2> <p class="angka keluar" id="total-pengeluaran">Rp 0</p>
      </article>
      <article class="kartu kartu-ringkas">
        <h2>Saldo</h2> <p class="angka" id="total-saldo">Rp 0</p>
      </article>
    </section>

    <section class="kartu">
      <h2>Tambah Transaksi</h2>
      <form id="form-transaksi">
        <div class="bidang">
          <label>Tanggal</label> <input type="date" id="tanggal">
        </div>
        <div class="bidang">
          <label>Jenis</label>
          <select id="jenis"><option value="pengeluaran">Pengeluaran</option><option value="pemasukan">Pemasukan</option></select>
        </div>
        <div class="bidang">
          <label>Kategori</label> <select id="kategori"></select>
        </div>
        <div class="bidang">
          <label>Nominal (Rp)</label> <input type="number" id="nominal">
        </div>
        <div class="bidang">
          <label>Catatan</label> <input type="text" id="catatan">
        </div>
        <button type="submit" class="tombol utama">Simpan Transaksi</button>
      </form>
    </section>

    <section class="kartu">
      <h2>Riwayat Transaksi</h2>
      <ul class="daftar" id="daftar-transaksi"></ul>
    </section>
  </main>
</body>
</html>
